<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sierra Death Dialog</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="page-head">
  <h1>YOU HAVE DIED</h1>
  <p>Sierra death dialog generator &mdash; click the screen for another demise</p>
</header>

<main>
  <canvas id="screen" width="320" height="200" title="Click for another death"></canvas>

  <section class="controls">
    <div class="knobs">
      <label>Style
        <select id="style">
          <option value="sci" selected>SCI0 (buttons)</option>
          <option value="agi">AGI (red border)</option>
        </select>
      </label>
      <label>Background
        <select id="bg">
          <option value="desert" selected>Desert</option>
          <option value="night">Night</option>
          <option value="black">Black</option>
          <option value="blue">Blue</option>
        </select>
      </label>
      <label>Box width <span id="boxWidthVal">26</span> chars
        <input id="boxWidth" type="range" min="14" max="36" value="26">
      </label>
      <label class="sci-only">Window title
        <input id="title" type="text" placeholder="none" maxlength="30" spellcheck="false">
      </label>
    </div>

    <div class="knobs">
      <label class="sci-only">Buttons
        <input id="buttons" type="text" value="Restore, Restart, Quit" maxlength="40" spellcheck="false">
      </label>
      <label class="chk sci-only"><input id="hlFirst" type="checkbox" checked> Highlight first button</label>
      <label class="chk agi-only hidden"><input id="pressEnter" type="checkbox" checked> &ldquo;Press ENTER&rdquo; line</label>
      <label class="chk"><input id="statusBar" type="checkbox" checked> Status line</label>
      <label class="status-text">Score
        <input id="statusLeft" type="text" value=" Score:29 of 158" maxlength="24" spellcheck="false">
      </label>
      <label class="status-text">Sound
        <input id="statusRight" type="text" value="Sound:on" maxlength="12" spellcheck="false">
      </label>
    </div>

    <textarea id="message" rows="5" spellcheck="false"></textarea>
    <p class="hint">The box grows to fit. Blank line = paragraph break.</p>

    <div class="buttons">
      <button id="shuffle" type="button">Another death</button>
      <label class="scale-pick">PNG scale
        <select id="scale">
          <option value="1">1x</option>
          <option value="2">2x</option>
          <option value="3" selected>3x</option>
          <option value="4">4x</option>
        </select>
      </label>
      <button id="download" type="button" class="primary">Download PNG</button>
    </div>
  </section>
</main>

<footer class="page-foot">
  <p>320&times;200 EGA, drawn procedurally &mdash; the 8&times;8 font is the public-domain font8x8 (IBM lineage), not a game rip.</p>
</footer>

<script src="app.js" defer></script>
</body>
</html>
